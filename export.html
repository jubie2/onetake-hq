<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Initial Win — Headless Export</title>
<meta name="viewport" content="width=2000,initial-scale=1" />
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  /* Each artboard: native pixel size, isolated stacking context */
  .ab {
    position: relative;
    overflow: hidden;
    margin: 32px auto;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
  }
  .stage-frame { width: 100%; height: 100%; position: relative; overflow: hidden; }
  .wp-deep {
    background:
      radial-gradient(50% 40% at 25% 30%, rgba(80,140,255,0.5), rgba(80,140,255,0) 70%),
      radial-gradient(60% 50% at 80% 75%, rgba(40,90,220,0.55), rgba(40,90,220,0) 70%),
      linear-gradient(160deg, #050f3a 0%, #081e6e 45%, #0a2bb0 100%);
  }
  .grain {
    position:absolute; inset:0; opacity:0.14; mix-blend-mode:overlay; pointer-events:none;
    background-image: radial-gradient(rgba(255,255,255,0.7) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  /* Yelp-ish (original layout) */
  .yp { color: #1a1a1a; background: #fff; height:100%; display:flex; flex-direction:column; }
  .yp-nav { height: 56px; background:#c41200; display:flex; align-items:center; padding:0 24px; gap:24px; color:#fff; font-weight:700; }
  .yp-nav .logo { font-size:22px; letter-spacing:-0.02em; }
  .yp-nav .search { flex:1; max-width:560px; height:36px; background:#fff; border-radius:4px; display:flex; align-items:center; padding:0 12px; gap:10px; color:#777; font-weight:500; font-size:14px; }
  .yp-nav .links { display:flex; gap:18px; font-size:14px; font-weight:500; align-items:center; }
  .yp-banner { height:200px; position:relative; overflow:hidden; }
  .yp-content { display:grid; grid-template-columns: 1fr 360px; gap:32px; padding:24px 48px 32px; flex:1; min-height:0;}
  .yp-h1 { font-size:30px; font-weight:800; letter-spacing:-0.02em; margin:0; }
  .yp-stars { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .yp-meta { font-size:13px; color:#444; margin-top:4px; }
  .yp-tags { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .yp-tag { font-size:12px; background:#f1f3f5; padding:4px 10px; border-radius:999px; color:#444; }
  .yp-actions { display:flex; gap:8px; margin-top:14px; }
  .yp-btn { padding:8px 14px; border-radius:4px; font-size:13px; font-weight:600; border:1px solid #d0d0d0; background:#fff; cursor:pointer; font-family: inherit; }
  .yp-btn.primary { background:#c41200; color:#fff; border-color:#c41200; }
  .yp-section-title { font-size:18px; font-weight:700; margin:24px 0 10px; }
  .yp-photos { display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; }
  .yp-photo { aspect-ratio:1/1; border-radius:4px; overflow:hidden; position:relative; }
  .yp-review { border-top:1px solid #eee; padding:14px 0; display:grid; grid-template-columns:48px 1fr; gap:12px; }
  .yp-avatar { width:44px; height:44px; border-radius:50%; }
  .yp-rev-name { font-weight:700; font-size:14px; }
  .yp-rev-loc { font-size:12px; color:#666; }
  .yp-rev-stars { display:flex; gap:2px; margin:6px 0;}
  .yp-rev-text { font-size:13px; line-height:1.5; color:#222; }
  .yp-aside-card { border:1px solid #e2e2e2; border-radius:8px; padding:16px; }
  .yp-aside-row { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed #eee;}
  .yp-aside-row:last-child { border-bottom:none; }
  .yp-open { color:#1f7a1f; font-weight:600; }
  .yp-list { font-size:13px; line-height:1.7; }

  /* Brand atomic styles */
  .brand-font {
    font-family: "Avenir Next", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-weight: 900;
    letter-spacing: -0.025em;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useMemo } = React;

const NAVY = "#0A1330";
const BLUE = "#1E5BFF";
const BLUE_HI = "#3a7bff";

const FONT_STACK = '"Avenir Next", "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
const UI_FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif';

/* ====== Brand primitives (inlined) ====== */
const PillWordmark = ({ h = 80, padX = 0.55, padY = 0.32, shadow = true, bg = "#ffffff" }) => {
  const fontSize = h * 0.42;
  const padXpx = h * padX;
  const padYpx = h * padY;
  return (
    <div style={{
      display:'inline-flex', alignItems:'center', justifyContent:'center',
      background: bg,
      padding: `${padYpx}px ${padXpx}px`,
      borderRadius: h,
      boxShadow: shadow
        ? `0 ${h*0.04}px ${h*0.18}px -${h*0.04}px rgba(10,20,60,0.18),
           0 ${h*0.01}px ${h*0.04}px -${h*0.005}px rgba(10,20,60,0.10),
           inset 0 1px 0 rgba(255,255,255,0.9)`
        : 'none',
      fontFamily: FONT_STACK,
      fontWeight: 900,
      letterSpacing: '-0.025em',
      fontSize, lineHeight: 1, whiteSpace: 'nowrap',
    }}>
      <span style={{color: NAVY}}>initial</span>
      <span style={{color: BLUE, marginLeft: fontSize*0.08}}>win</span>
    </div>
  );
};

const Monogram = ({ size = 200, mode = "pill" }) => {
  const fontSize = size * 0.5;
  const baseInner = (
    <span><span style={{color: mode==='pill' ? NAVY : '#fff'}}>i</span>
    <span style={{color: mode==='pill' ? BLUE : (mode==='blue' ? 'rgba(255,255,255,0.65)' : BLUE_HI), marginLeft: fontSize*0.04}}>w</span></span>
  );
  if (mode === "pill") {
    return (
      <div style={{
        width: size, height: size, borderRadius: size*0.28,
        background:'#ffffff',
        boxShadow:`0 ${size*0.04}px ${size*0.12}px -${size*0.02}px rgba(10,20,60,0.25),
                   inset 0 ${size*0.012}px 0 rgba(255,255,255,0.9)`,
        display:'grid', placeItems:'center',
        fontFamily: FONT_STACK,
        fontWeight:900, letterSpacing:'-0.04em', fontSize, lineHeight:1,
      }}>{baseInner}</div>
    );
  }
  if (mode === "blue") {
    return (
      <div style={{
        width: size, height: size, borderRadius: size*0.28,
        background:`linear-gradient(160deg, ${BLUE_HI}, ${BLUE} 55%, #0a3ad6)`,
        boxShadow:`0 ${size*0.05}px ${size*0.15}px -${size*0.03}px rgba(10,40,180,0.5),
                   inset 0 ${size*0.012}px 0 rgba(255,255,255,0.5),
                   inset 0 -${size*0.008}px 0 rgba(0,0,20,0.25)`,
        display:'grid', placeItems:'center',
        fontFamily: FONT_STACK,
        fontWeight:900, letterSpacing:'-0.04em', fontSize, lineHeight:1,
        position:'relative', overflow:'hidden',
      }}>
        <div style={{position:'absolute', inset:`${size*0.03}px ${size*0.03}px auto ${size*0.03}px`, height:'45%',
          borderRadius:`${size*0.25}px ${size*0.25}px ${size*0.4}px ${size*0.4}px`,
          background:'linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0) 80%)', filter:'blur(2px)'}}/>
        <span style={{position:'relative', zIndex:1}}>{baseInner}</span>
      </div>
    );
  }
  return (
    <div style={{
      width: size, height: size, borderRadius: size*0.28,
      background: NAVY,
      display:'grid', placeItems:'center',
      fontFamily: FONT_STACK,
      fontWeight:900, letterSpacing:'-0.04em', fontSize, lineHeight:1,
    }}>{baseInner}</div>
  );
};

const Orb = ({ size = 120, x = 0, y = 0, opacity = 1 }) => (
  <div style={{
    position:'absolute', left:x, top:y, width:size, height:size, borderRadius:'50%',
    background:`radial-gradient(circle at 32% 22%, rgba(255,255,255,0.85) 0%, #5c8bff 35%, #0a2bb0 75%, #050f3a 100%)`,
    boxShadow:`0 ${size*0.1}px ${size*0.25}px rgba(0,10,60,0.45),
               inset 0 ${size*0.04}px ${size*0.06}px rgba(255,255,255,0.45),
               inset 0 -${size*0.03}px ${size*0.05}px rgba(0,0,30,0.3)`,
    opacity,
  }}>
    <div style={{position:'absolute', left:'18%', top:'12%', width:'34%', height:'18%',
      borderRadius:'50%', background:'rgba(255,255,255,0.7)', filter:'blur(2px)'}}/>
  </div>
);

/* ====== Scenes ====== */
const Wallpaper = () => {
  const orbs = useMemo(() => {
    const out = []; let s = 17;
    const r = () => { s = (s*9301+49297)%233280; return s/233280; };
    for (let i=0;i<14;i++) out.push({size:80+r()*260, x:r()*1920, y:r()*1080, op:0.6+r()*0.4});
    return out;
  }, []);
  return (
    <div className="stage-frame wp-deep">
      <div style={{position:'absolute', inset:0, background:'radial-gradient(40% 30% at 30% 35%, rgba(140,180,255,0.32), rgba(140,180,255,0) 70%)'}}/>
      <div style={{position:'absolute', inset:0, background:'radial-gradient(35% 30% at 75% 70%, rgba(60,110,255,0.42), rgba(60,110,255,0) 70%)'}}/>
      <div style={{position:'absolute', left:'-10%', top:'10%', width:'120%', height:'40%',
        background:'linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.06) 50%, transparent 70%)',
        transform:'rotate(-8deg)', filter:'blur(20px)'}}/>
      {orbs.map((o,i)=>(<Orb key={i} size={o.size} x={o.x-o.size/2} y={o.y-o.size/2} opacity={o.op}/>))}
      <Orb size={460} x={1140} y={130} opacity={0.95}/>
      <Orb size={300} x={120} y={580} opacity={0.85}/>
      <div className="grain"/>
    </div>
  );
};

const AvatarPill = () => (
  <div className="stage-frame wp-deep" style={{display:'grid', placeItems:'center'}}>
    <div style={{position:'absolute', left:120, top:160}}><Orb size={70} opacity={0.65}/></div>
    <div style={{position:'absolute', right:140, bottom:200}}><Orb size={90} opacity={0.7}/></div>
    <div style={{position:'absolute', right:200, top:120}}><Orb size={50} opacity={0.6}/></div>
    <PillWordmark h={170}/>
  </div>
);

const AvatarMonoBlue = () => (
  <div className="stage-frame" style={{
    background:'radial-gradient(70% 60% at 50% 40%, #1a3fb8 0%, #0b2a8a 55%, #03103f 100%)',
    display:'grid', placeItems:'center'
  }}>
    <div style={{position:'absolute', inset:0, background:'radial-gradient(35% 25% at 25% 25%, rgba(140,180,255,0.32), rgba(140,180,255,0) 70%)'}}/>
    <div style={{position:'absolute', left:140, top:140}}><Orb size={80} opacity={0.6}/></div>
    <div style={{position:'absolute', right:160, bottom:180}}><Orb size={100} opacity={0.7}/></div>
    <Monogram size={620} mode="blue"/>
  </div>
);

const AvatarMonoPill = () => (
  <div className="stage-frame wp-deep" style={{display:'grid', placeItems:'center'}}>
    <div style={{position:'absolute', left:140, top:140}}><Orb size={80} opacity={0.6}/></div>
    <div style={{position:'absolute', right:160, bottom:180}}><Orb size={100} opacity={0.7}/></div>
    <Monogram size={620} mode="pill"/>
  </div>
);

const Star = ({filled=true, size=18}) => (
  <svg width={size} height={size} viewBox="0 0 24 24">
    <path d="M12 2 l3.1 6.6 7.2 1 -5.2 5.1 1.3 7.3 -6.4 -3.4 -6.4 3.4 1.3 -7.3 -5.2 -5.1 7.2 -1 Z"
      fill={filled ? "#e63d29" : "#d8d8d8"} />
  </svg>
);
const Stars = ({count=5, size=18}) => (
  <span style={{display:'inline-flex', gap:2}}>
    {Array.from({length:5}).map((_,i)=>(<Star key={i} filled={i<count} size={size}/>))}
  </span>
);
const PhotoTile = ({ kind }) => {
  const swatches = {
    web1: 'linear-gradient(135deg, #1546e0, #3a6cff)',
    web2: 'linear-gradient(135deg, #0a2bb0, #5c8bff)',
    spa1: 'linear-gradient(135deg, #f7d9d3, #e8b3a8)',
    desk: 'linear-gradient(135deg, #0e1a3a, #1a3fb8)',
  };
  return (
    <div className="yp-photo" style={{background: swatches[kind] || '#ddd'}}>
      {kind==='web1' && (
        <div style={{position:'absolute', inset:0, display:'grid', placeItems:'center'}}>
          <PillWordmark h={36}/>
        </div>
      )}
      {kind==='web2' && (
        <div style={{position:'absolute', right:14, bottom:14}}>
          <Monogram size={70} mode="blue"/>
        </div>
      )}
    </div>
  );
};

const YelpPage = () => {
  const reviews = [
    { name:'Marisol R.', loc:'La Jolla, CA', stars:5, date:'4/12/2026',
      text:'We launched with Initial Win three months ago and our med spa booked out for six weeks straight. The site is fast, beautiful, and the AI chat actually books appointments while we sleep. Easily the best money we\'ve spent on marketing.' },
    { name:'Devon K.', loc:'San Diego, CA', stars:5, date:'3/28/2026',
      text:'Cole and the team rebuilt our entire website in under two weeks. SEO traffic is up 240% and the booking widget integrated perfectly with our Vagaro. The monthly retainer is worth every penny.' },
    { name:'Priya S.', loc:'Encinitas, CA', stars:5, date:'2/9/2026',
      text:'Was nervous about another agency after two bad experiences. Initial Win is the real deal — communicative, fast, and the design is gorgeous. Multiple clients have asked who built our site.' },
  ];
  return (
    <div className="stage-frame">
      <div className="yp" style={{fontFamily: UI_FONT}}>
        <div className="yp-nav">
          <div className="logo">reviewly</div>
          <div className="search">
            <span>🔍</span>
            <span style={{flex:1}}>Find · web design</span>
            <span style={{borderLeft:'1px solid #ddd', paddingLeft:10}}>Near · San Diego, CA</span>
          </div>
          <div className="links">
            <span>Write a Review</span>
            <span>For Businesses</span>
            <span>Log In</span>
            <span style={{background:'#fff', color:'#c41200', padding:'6px 12px', borderRadius:4}}>Sign Up</span>
          </div>
        </div>

        <div className="yp-banner" style={{background:'radial-gradient(70% 60% at 30% 40%, #1a3fb8 0%, #050f3a 100%)'}}>
          <div style={{position:'absolute', inset:0, background:'radial-gradient(30% 25% at 80% 30%, rgba(140,180,255,0.4), rgba(140,180,255,0) 70%)'}}/>
          <div style={{position:'absolute', right:60, top:30}}><Orb size={140} opacity={0.85}/></div>
          <div style={{position:'absolute', right:240, top:90}}><Orb size={70} opacity={0.7}/></div>
          <div style={{position:'absolute', right:380, top:40}}><Orb size={50} opacity={0.55}/></div>
          <div style={{position:'absolute', left:48, top:'50%', transform:'translateY(-50%)'}}>
            <PillWordmark h={72}/>
            <div style={{marginTop:14, color:'rgba(255,255,255,0.88)', fontSize:14, fontWeight:500, letterSpacing:'0.02em'}}>
              Websites that book appointments while you sleep.

        </div>

        <div className="yp-content">
          <div style={{minWidth:0, overflow:'hidden'}}>

              <div style={{borderRadius:18, overflow:'hidden', boxShadow:'0 10px 30px -8px rgba(0,0,0,0.25)', flexShrink:0, background:'#fff', padding:8}}>

              <div style={{paddingTop:48}}>

                <div className="yp-stars">

                <div className="yp-actions">

            <div className="yp-section-title">Photos & Videos</div>
            <div className="yp-photos">
              <PhotoTile kind="web1"/>
              <PhotoTile kind="spa1"/>

              <PhotoTile kind="web2"/>
            </div>

            <div className="yp-section-title">Recommended Reviews (127)</div>
            <div>
              {reviews.map((r,i)=>(
                <div className="yp-review" key={i}>

                    <div className="yp-rev-name">{r.name}</div>
                    <div className="yp-rev-loc">{r.loc}</div>
                    <div className="yp-rev-stars"><Stars count={r.stars} size={14}/><span style={{fontSize:12, color:'#666', marginLeft:6}}>{r.date}</span></div>
                    <div className="yp-rev-text">{r.text}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div>
            <div className="yp-aside-card">
              <div style={{fontSize:14, fontWeight:700, marginBottom:8}}>Hours</div>
              {[
                ['Mon', '9:00 AM – 6:00 PM'],
                ['Tue', '9:00 AM – 6:00 PM'],

                ['Sun', 'Closed'],
              ].map(([d,h],i)=>(
                <div className="yp-aside-row" key={i}>
                  <span style={{fontWeight:600}}>{d}</span>

              ))}
              <div style={{marginTop:10, fontSize:13}}>
                <span className="yp-open">Open now</span> · Closes 6:00 PM
              </div>

        </div>
      </div>
    </div>

const Banner = () => (
  <div className="stage-frame">
    <div style={{position:'absolute', inset:0,
      background:'radial-gradient(60% 80% at 25% 50%, #1a3fb8 0%, #0b2a8a 50%, #050f3a 100%)'}}/>

      <div style={{marginTop:24, fontSize:24, lineHeight:1.3, fontWeight:500,

const LockupOnLight = () => (
  <div className="stage-frame" style={{
    background:'linear-gradient(160deg, #f4f7ff 0%, #e3ecff 100%)',

    <PillWordmark h={150}/>

);

const LockupOnDeep = () => (

const TAG_FONT = UI_FONT;

const FloatingOrbs = ({ count = 6, seed = 9, w = 1080, h = 1080 }) => {
  const orbs = useMemo(() => {
    const out = []; let s = seed;
    const r = () => { s = (s*9301+49297)%233280; return s/233280; };
    for (let i=0;i<count;i++) out.push({size:60+r()*220, x:r()*w, y:r()*h, op:0.55+r()*0.4});
    return out;
  }, [count, seed, w, h]);
  return <>{orbs.map((o,i)=>(<Orb key={i} size={o.size} x={o.x-o.size/2} y={o.y-o.size/2} opacity={o.op}/>))}</>;
};
